name: Zber a publikovanie

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: zsr
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  zber:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Obnov databazu z vetvy data
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:zsr.db.gz | gunzip > zsr.db
            echo "Databaza obnovena ($(du -h zsr.db | cut -f1))"
          else
            echo "Vetva data este neexistuje, zaciname odznova"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Zber, upozornenia, report a mapa
        env:
          WATCH: ${{ vars.WATCH }}
          ALERT_DELAY: ${{ vars.ALERT_DELAY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZSR_KEEP_DAYS: ${{ vars.ZSR_KEEP_DAYS }}
        run: python zsr_monitor.py ci

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Uloz databazu do vetvy data (jediny commit, historia sa neprodukuje)
        run: |
          rm -rf /tmp/datarepo && mkdir /tmp/datarepo
          gzip -c zsr.db > /tmp/datarepo/zsr.db.gz
          cd /tmp/datarepo
          git init -q -b data
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add zsr.db.gz
          git commit -q -m "databaza $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin data
